<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Поручение или результат? — интерактив</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#19304b;--blue:#174f90;--light:#f2f7fd;--line:#dce7f2;--green:#186d50;--red:#a34738}*{box-sizing:border-box}body{margin:0;background:#fff;padding:20px}.widget{max-width:930px;margin:auto;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 6px 26px rgba(25,61,100,.07)}header{padding:25px 26px 20px;background:linear-gradient(110deg,#eaf4ff,#f8fbff)}h2{font-size:24px;line-height:1.2;margin:0 0 9px}header p{font-size:15px;line-height:1.5;margin:0;max-width:680px}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:19px}.scenario{border:1px solid #b9d2ec;background:white;padding:10px 14px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;color:#315373}.scenario[aria-selected=true]{background:var(--blue);border-color:var(--blue);color:white}.scenario:focus-visible,button:focus-visible{outline:3px solid #e8a235;outline-offset:2px}.main{padding:22px 25px 24px}.task{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:#667f98;font-weight:800;margin-bottom:5px}.heading{font-size:20px;line-height:1.35;font-weight:800;margin:0 0 17px}.table{display:grid;grid-template-columns:1fr 1fr;gap:13px}.cell{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff;transition:transform .2s}.cell-head{padding:13px 16px;font-size:15px;font-weight:bold;display:flex;align-items:center;gap:8px}.bad .cell-head{background:#fff0ed;color:var(--red)}.good .cell-head{background:#eaf8f1;color:var(--green)}.quote{padding:18px 16px;min-height:135px;font-size:16px;line-height:1.52;font-weight:600}.result{margin:0 13px 13px;border-top:1px solid var(--line);padding:13px 3px 3px;font-size:14px;line-height:1.5}.result b{display:block;margin-bottom:5px;color:#465b75}.toggle{display:inline-flex;gap:6px;align-items:center;border:1px solid #a8c6e5;background:#f0f7ff;color:var(--blue);font-weight:700;padding:10px 13px;border-radius:9px;cursor:pointer;font-size:13px;margin-top:16px}.lesson{display:none;margin-top:14px;padding:14px 17px;background:var(--light);border-left:4px solid var(--blue);border-radius:9px;line-height:1.5;font-size:14px}.lesson.open{display:block}.foot{padding:0 25px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}.count{font-size:13px;color:#667f98}.next{border:0;background:var(--blue);color:white;border-radius:9px;padding:11px 17px;font-weight:700;cursor:pointer}.next:hover,.scenario[aria-selected=true]:hover{background:#103e72}@media(max-width:640px){body{padding:9px}.widget{border-radius:12px}header{padding:19px 16px}h2{font-size:21px}.main{padding:18px 14px}.heading{font-size:18px}.table{grid-template-columns:1fr}.quote{min-height:0}.foot{padding:0 14px 18px}.controls{gap:6px}.scenario{font-size:12px;padding:9px}}
</style>
</head>
<body>
<section class="widget" aria-label="Сравнение поручений">
<header><h2>Поручение или результат?</h2><p>Пять рабочих ситуаций финансового директора. Сравните, что услышит сотрудник и какой результат вы получите. Откройте вывод для каждого примера.</p><nav class="controls" id="tabs" aria-label="Выбор ситуации"></nav></header>
<div class="main"><div class="task" id="topic"></div><h3 class="heading" id="title"></h3>
<div class="table"><section class="cell bad"><div class="cell-head">✕ Неудачное поручение</div><div class="quote" id="bad"></div><div class="result"><b>Что вы рискуете получить</b><span id="badResult"></span></div></section><section class="cell good"><div class="cell-head">✓ Хорошее поручение</div><div class="quote" id="good"></div><div class="result"><b>Что вы получите</b><span id="goodResult"></span></div></section></div>
<button class="toggle" id="reveal" aria-expanded="false" aria-controls="lesson">Почему второй вариант лучше? ↓</button><div class="lesson" id="lesson"></div></div>
<div class="foot"><span class="count" id="count"></span><button class="next" id="next">Следующая ситуация →</button></div></section>
<script>
const cases=[
{tag:'Дебиторская задолженность',title:'Кого из должников взять под личный контроль?',bad:'«Посмотри, что у нас с дебиторкой, и подготовь информацию к пятнице».',good:'«К пятнице выдели десять крупнейших проблемных должников, оцени причины просрочки и предложи меры по каждому. Мне нужно определить, где требуется мое вмешательство».',badResult:'Общую выгрузку задолженности. Решать, на кого обратить внимание, придется самостоятельно.',goodResult:'Приоритетный список должников с причинами просрочки и предложенными действиями по каждому.',lesson:'Названо управленческое решение, ради которого нужен анализ: где CFO должен вмешаться. Сотрудник понимает, что выгрузки недостаточно.'},
{tag:'План-факт',title:'Почему выросли расходы?',bad:'«Подготовь анализ отклонений затрат от бюджета за квартал».',good:'«К среде выдели три основных причины превышения бюджета, оцени вклад каждой в рублях и отдели разовые отклонения от тех, что повлияют на прогноз до конца года».',badResult:'Таблицу отклонений по статьям без объяснения причин и последствий.',goodResult:'Разбор существенных причин и оценку того, какие из них требуют пересмотра прогноза.',lesson:'Поручение ориентировано на объяснение отклонений и их последствия, а не на пересчет уже известных цифр.'},
{tag:'Ликвидность',title:'Где возникнет дефицит денег?',bad:'«Обнови платежный календарь и пришли актуальный файл».',good:'«Сегодня до 16:00 обнови платежный календарь на две недели, выдели дни с отрицательным остатком, укажи величину дефицита и предложи варианты переноса некритичных платежей».',badResult:'Свежую таблицу платежей, где возможный кассовый разрыв придется искать самому.',goodResult:'Даты и суммы потенциальных разрывов с вариантами действий для обсуждения.',lesson:'Обозначено не только обновление данных, но и решение, которое они должны поддержать: как избежать дефицита ликвидности.'}

];
let current=0,opened=false;const el=id=>document.getElementById(id),tabs=el('tabs');function render(){const d=cases[current];tabs.innerHTML='';cases.forEach((c,i)=>{const b=document.createElement('button');b.className='scenario';b.type='button';b.textContent=`${i+1}. ${c.tag}`;b.setAttribute('aria-selected',String(i===current));b.onclick=()=>{current=i;opened=false;render()};tabs.append(b)});for(const key of ['bad','good','badResult','goodResult','lesson'])el(key).textContent=d[key];el('topic').textContent=d.tag;el('title').textContent=d.title;el('count').textContent=`Ситуация ${current+1} из ${cases.length}`;el('lesson').classList.toggle('open',opened);el('reveal').setAttribute('aria-expanded',String(opened));el('reveal').textContent=opened?'Скрыть объяснение ↑':'Почему второй вариант лучше? ↓';el('next').textContent=current===cases.length-1?'К первой ситуации ↻':'Следующая ситуация →'}el('reveal').onclick=()=>{opened=!opened;render()};el('next').onclick=()=>{current=(current+1)%cases.length;opened=false;render()};render();
</script>
</body>
</html>
